org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# The release build's unit tests too (testReleaseUnitTest), which show it has no fixture entry
# (lor-oech). AGP 9 otherwise makes unit tests for the tested build type, debug, only.
android.onlyEnableUnitTestForTheTestedBuildType=false
# The Kotlin daemon gets its own heap: with Gradle's 2 GB it ran out of memory linking the lab's
# production wasm bundle beside the app's builds on boat. web-dev.sh sets its own, smaller, here.
kotlin.daemon.jvmargs=-Xmx3g
